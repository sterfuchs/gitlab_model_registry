<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Release Registry</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Release Registry</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="lessons.html">Lessons & Research</a>
    </nav>
  </header>

  <main>
    <nav id="view-tabs">
      <button data-view="releases" class="active">Releases</button>
      <button data-view="models">Models</button>
    </nav>
    <section id="controls">
      <input type="text" id="search" placeholder="Search..." />
      <select id="filter-namespace">
        <option value="">All teams/groups</option>
      </select>
      <select id="sort-by">
        <option value="project_name">Project name</option>
        <option value="namespace">Namespace</option>
      </select>
    </section>
    <section id="results">
      <!-- Results will be injected here -->
    </section>
  </main>

  <footer>
    <p>Generated via GitLab Pages &amp; GitLab API</p>
  </footer>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
